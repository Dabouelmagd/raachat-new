openapi: 3.0.3
info:
  title: Raa Chat API
  version: 0.1.0
  description: |
    عقد الـ API لتطبيق رع شات. يطابق الأنواع في src/types.ts والأكشنز في useAppActions().
    مستقل عن اختيار الباك إند (Supabase أو Node/Express+Prisma).
servers:
  - url: https://api.example.com/v1
security:
  - bearer: []
tags:
  - { name: auth }
  - { name: threads }
  - { name: messages }
  - { name: rooms }
  - { name: stories }
  - { name: wallet }
  - { name: ads }
  - { name: search }
  - { name: translate }
  - { name: calls }
  - { name: admin }
  - { name: push }
  - { name: reports }
paths:
  /auth/otp/request:
    post:
      tags: [auth]
      security: []
      summary: طلب رمز OTP على رقم أو إيميل
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, target]
              properties:
                channel: { type: string, enum: [phone, email] }
                target: { type: string }
      responses:
        "204": { description: تم الإرسال }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/otp/verify:
    post:
      tags: [auth]
      security: []
      summary: التحقق من الرمز (صلاحية 5 دقائق، 5 محاولات)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, target, code]
              properties:
                channel: { type: string, enum: [phone, email] }
                target: { type: string }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: جلسة جديدة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: تجديد الجلسة (يدوّر الـ refresh token؛ القديم يتبطّل)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        "200":
          description: توكنات جديدة
          content:
            application/json:
              schema:
                type: object
                properties: { accessToken: { type: string }, refreshToken: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: إنهاء الجلسة الحالية
      responses:
        "204": { description: تم }
  /sessions:
    get:
      tags: [auth]
      summary: الجلسات النشطة
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    device: { type: string }
                    createdAt: { type: string, format: date-time }
                    lastUsed: { type: string, format: date-time }
                    current: { type: boolean }
    delete:
      tags: [auth]
      summary: إنهاء كل الجلسات الأخرى
      responses:
        "204": { description: تم }
  /sessions/{id}:
    delete:
      tags: [auth]
      summary: إنهاء جلسة معيّنة
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: تم }
  /me:
    get:
      tags: [auth]
      summary: بياناتي
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [auth]
      summary: تعديل الملف الشخصي (الاسم/الحالة/اللون/الصورة/اللغة)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string }
                color: { type: string, example: "#E1523E" }
                photoUrl: { type: string, nullable: true }
                lang: { type: string, enum: [ar, en, zh, fr] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    delete:
      tags: [account]
      summary: "حذف الحساب نهائيًا (إخفاء الهوية)"
      description: "لازم code صحيح. لو الرصيد أكبر من صفر لازم forfeitBalance=true. بيمسح البيانات الشخصية والرسائل والستوري والجلسات ويحتفظ بسجل المعاملات بدون هوية."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                forfeitBalance: { type: boolean }
      responses:
        "204": { description: "تم الحذف" }
        "400": { $ref: "#/components/responses/Error" }
  /blocks:
    get:
      tags: [safety]
      summary: "قايمة المحظورين"
      responses:
        "200": { description: "مصفوفة مستخدمين مع blockedAt" }
    post:
      tags: [safety]
      summary: "حظر مستخدم"
      description: "بيمنع الرسائل الخاصة في الاتجاهين ويخفي رسائله وستوريزه عندك."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
      responses:
        "204": { description: "تم" }
        "404": { $ref: "#/components/responses/Error" }
  /blocks/{userId}:
    delete:
      tags: [safety]
      summary: "إلغاء حظر"
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "تم" }
  /users:
    get:
      tags: [auth]
      summary: بحث في المستخدمين (اسم/رقم/إيميل) لبدء دردشة أو إضافة أعضاء
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
  /uploads:
    post:
      tags: [messages]
      summary: رفع ملف (حد 10MB) — يرجّع رابط يتحط في attachment.url
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        "201":
          description: تم
          content:
            application/json:
              schema:
                type: object
                properties: { name: { type: string }, size: { type: integer }, mime: { type: string }, url: { type: string } }
  /threads/public:
    get:
      tags: [threads]
      summary: اكتشاف الجروبات العامة
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Thread" }
  /threads/{id}:
    patch:
      tags: [threads]
      summary: تعديل شكل الجروب (اسم/لون/أيقونة/صورة) — للمالك والمشرفين
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                color: { type: string, nullable: true }
                icon: { type: string, nullable: true }
                photoUrl: { type: string, nullable: true }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
  /threads/{id}/members:
    post:
      tags: [threads]
      summary: إضافة أعضاء لجروب (بلا حد أقصى)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberIds]
              properties: { memberIds: { type: array, items: { type: string } } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
  /threads/{id}/read:
    post:
      tags: [threads]
      summary: تعليم المحادثة كمقروءة
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: تم }
  /threads:
    get:
      tags: [threads]
      summary: قائمة المحادثات
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Thread" }
    post:
      tags: [threads]
      summary: إنشاء dm (يرجع الموجود إن وُجد) أو جروب
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [dm, group] }
                name: { type: string }
                memberIds: { type: array, items: { type: string }, description: "بدون حد أقصى" }
                color: { type: string, example: "#2F6DB5" }
                icon: { type: string }
                photoUrl: { type: string }
                isPublic: { type: boolean }
      responses:
        "200":
          description: dm موجود
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "201":
          description: تم الإنشاء
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
  /threads/{id}/join:
    post:
      tags: [threads]
      summary: انضمام لجروب عام
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
  /threads/{id}/members/me:
    delete:
      tags: [threads]
      summary: مغادرة المحادثة
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: تمت المغادرة }
  /threads/{id}/messages:
    get:
      tags: [messages]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: before, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
    post:
      tags: [messages]
      summary: إرسال رسالة
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                replyToId: { type: string }
                attachment: { $ref: "#/components/schemas/Attachment" }
      responses:
        "201":
          description: تم
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /messages/{id}:
    patch:
      tags: [messages]
      summary: تعديل رسالة
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties: { text: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
    delete:
      tags: [messages]
      summary: حذف رسالة
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: تم }
  /messages/{id}/reactions/{emoji}:
    put:
      tags: [messages]
      summary: تبديل تفاعل (toggle)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: emoji, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /rooms:
    get:
      tags: [rooms]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VoiceRoom" }
    post:
      tags: [rooms]
      summary: إنشاء غرفة صوتية (غرفة LiveKit)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string } }
      responses:
        "201":
          description: تم
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceRoom" }
  /rooms/{id}/join:
    post:
      tags: [rooms]
      summary: دخول غرفة بهوية حقيقية أو مؤقتة
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityMode]
              properties:
                identityMode: { type: string, enum: [real, temp] }
      responses:
        "200":
          description: توكن LiveKit
          content:
            application/json:
              schema:
                type: object
                required: [token, url]
                properties:
                  token: { type: string }
                  url: { type: string }
                  displayName: { type: string }
  /rooms/{id}/leave:
    post:
      tags: [rooms]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: تم }
  /stories:
    get:
      tags: [stories]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Story" }
    post:
      tags: [stories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caption]
              properties:
                caption: { type: string }
                colorFrom: { type: string }
                colorTo: { type: string }
                imageUrl: { type: string }
                colorFrom: { type: string }
                colorTo: { type: string }
      responses:
        "201":
          description: تم
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Story" }
  /stories/{id}/seen:
    post:
      tags: [stories]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: تم }
  /wallet:
    get:
      tags: [wallet]
      summary: الرصيد وآخر العمليات (الرصيد مشتق من الدفتر)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /bills/inquiry:
    post:
      tags: [wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceKey, account]
              properties:
                serviceKey: { type: string }
                account: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillInquiry" }
  /bills/pay:
    post:
      tags: [wallet]
      summary: دفع فاتورة. Idempotency-Key إجباري، والـ PIN يُتحقق منه على الخادم.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceKey, account, amount, pin]
              properties:
                serviceKey: { type: string }
                account: { type: string }
                amount: { type: integer, description: بالقروش }
                offerCode: { type: string }
                pin: { type: string }
      responses:
        "200":
          description: إيصال
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        "402": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
  /offers/validate:
    post:
      tags: [wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, amount]
              properties:
                code: { type: string }
                amount: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  discount: { type: integer }
  /ads/catalog:
    get:
      tags: [ads]
      summary: الحملات الشغالة النهارده (معتمدة وفي فترتها)
      description: التطبيق بيستخدمها بدل الكتالوج المحلي. التاريخ بتوقيت القاهرة.
      responses:
        "200":
          description: القائمة بترتيب الأولوية
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdPublic" }
  /ads/today:
    get:
      tags: [ads]
      summary: مواعيد النوافذ اللي اتعرضت للمستخدم النهارده
      parameters:
        - { name: day, in: query, required: true, schema: { type: string, example: "2026-10-10" } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties: { shown: { type: array, items: { type: integer, minimum: 0, maximum: 23 } } }
  /ads/events:
    post:
      tags: [ads]
      summary: تسجيل ظهور/ضغط/إغلاق (مرة واحدة لكل مستخدم في اليوم)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day, adId, kind]
              properties:
                day: { type: string, example: "2026-10-10" }
                slot: { type: integer, minimum: 0, maximum: 23, description: موعد النافذة المنبثقة }
                adId: { type: string }
                kind: { type: string, enum: [shown, clicked, closed] }
                placement: { type: string, enum: [modal, banner, services, story] }
      responses:
        "204": { description: تم }
  /push/key:
    get:
      tags: [push]
      summary: المفتاح العام VAPID (null لو الإشعارات غير مفعّلة)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, properties: { publicKey: { type: string, nullable: true } } }
  /push/subscribe:
    post:
      tags: [push]
      summary: تسجيل جهاز للإشعارات (أقصى ١٠ أجهزة للمستخدم)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties: { p256dh: { type: string }, auth: { type: string } }
      responses:
        "204": { description: تم }
  /push/unsubscribe:
    post:
      tags: [push]
      summary: إلغاء تسجيل جهاز
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [endpoint], properties: { endpoint: { type: string } } }
      responses:
        "204": { description: تم }
  /rtc/config:
    get:
      tags: [calls]
      summary: إعدادات STUN/TURN (بيانات TURN مؤقتة بـ HMAC)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, properties: { iceServers: { type: array, items: { type: object } } } }
  /auth/handoff/exchange:
    post:
      tags: [admin]
      security: []
      summary: استبدال تذكرة الدخول المباشر بجلسة للوحة الإدارة
      description: التذكرة تُستخدم مرة واحدة وصلاحيتها ٦٠ ثانية. ترفض لو الحساب موقوف أو مش من الفريق.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string, minLength: 20 } } }
      responses:
        "200":
          description: جلسة جديدة
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /search/ai:
    post:
      tags: [search]
      summary: بحث عميق بالذكاء الاصطناعي (فهم السؤال + بحث دلالي + إجابة مُلخّصة)
      description: |
        الباك إند يعمل embeddings (مثلاً pgvector) + BM25 + إعادة ترتيب بنموذج لغوي،
        ويبحث في رسائل المستخدم وجهات الاتصال والجروبات والغرف والخدمات والعروض والإعدادات.
        لازم يحترم صلاحيات المستخدم: ما يرجّعش إلا محادثات هو عضو فيها.
        الواجهة الحالية بتستدعي نفس الشكل ده من src/search/aiSearch.ts (محلي للديمو).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, maxLength: 300 }
                deep: { type: boolean, default: true, description: "false = بحث نصي عادي بدون ذكاء اصطناعي" }
                kinds:
                  type: array
                  items: { $ref: "#/components/schemas/SearchKind" }
      responses:
        "200":
          description: النتائج
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "429": { $ref: "#/components/responses/TooMany" }
  /translate:
    post:
      tags: [translate]
      summary: ترجمة نص (للرسائل والترجمة الفورية في المكالمات)
      description: |
        الواجهة بتستدعيها من src/translate/engine.ts (translate). في الديمو بتترجم عبارات محدودة محليًا.
        الباك إند يوصّل محرك ترجمة (Google Cloud Translation / DeepL / نموذج لغوي) ويدعم أي لغة (كود BCP-47).
        للمكالمات: الأفضل بث (WebSocket/SSE) — الكلام يتحوّل لنص (STT) ثم يترجم ثم (اختياري) ينطق (TTS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, to]
              properties:
                text: { type: string, maxLength: 5000 }
                to: { type: string, example: zh-CN }
                from: { type: string, example: ar, description: "اتركه فاضي للكشف التلقائي" }
      responses:
        "200":
          description: النتيجة
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  from: { type: string }
        "429": { $ref: "#/components/responses/TooMany" }
