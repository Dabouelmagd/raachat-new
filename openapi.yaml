components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: خطأ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooMany:
      description: محاولات كثيرة
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    SearchKind:
      type: string
      enum: [message, chat, person, group, room, service, offer, setting, story]
    SearchHit:
      type: object
      required: [id, kind, title, to, score]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/SearchKind" }
        title: { type: string }
        sub: { type: string }
        to: { type: string, description: "مسار الفتح داخل التطبيق" }
        score: { type: number }
        via: { type: string, enum: [exact, synonym, fuzzy] }
    SearchResponse:
      type: object
      required: [results]
      properties:
        answer: { type: string, nullable: true, description: "إجابة مُلخّصة (في البحث العميق فقط)" }
        interpretation:
          type: object
          properties:
            topic: { type: array, items: { type: string } }
            kinds: { type: array, items: { $ref: "#/components/schemas/SearchKind" } }
            person: { type: string }
            expanded: { type: array, items: { type: string } }
        results:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Session:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [user, support, admin, owner] }
    Thread:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type: { type: string, enum: [dm, group] }
        name: { type: string }
        memberIds: { type: array, items: { type: string } }
        createdByMe: { type: boolean }
        color: { type: string, example: "#2F6DB5", description: لون الجروب }
        icon: { type: string, description: مفتاح أيقونة (users, heart, code…) }
        photo: { type: string, description: رابط صورة الجروب }
    CallRecord:
      type: object
      required: [threadId, mode, dir, at, dur]
      properties:
        id: { type: string }
        threadId: { type: string }
        mode: { type: string, enum: [voice, video] }
        dir: { type: string, enum: [in, out, missed] }
        at: { type: integer, description: وقت البدء (ms) }
        dur: { type: integer, description: المدة بالثواني }
    Message:
      type: object
      required: [id, threadId, authorId, authorName, text, time, reactions]
      properties:
        id: { type: string }
        threadId: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        text: { type: string }
        time: { type: string, format: date-time }
        read: { type: boolean }
        replyToId: { type: string }
        reactions:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        edited: { type: boolean }
        deleted: { type: boolean }
        attachment: { $ref: "#/components/schemas/Attachment" }
    Attachment:
      type: object
      required: [name, size, mime, url]
      properties:
        name: { type: string }
        size: { type: integer }
        mime: { type: string }
        url: { type: string, description: "/uploads/… أو https" }
        text: { type: string, description: أول جزء من الملفات النصية }
        voice:
          type: object
          properties: { duration: { type: integer }, waveform: { type: array, items: { type: number } } }
    RoomParticipant:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        muted: { type: boolean }
        speaking: { type: boolean }
        isHost: { type: boolean }
    VoiceRoom:
      type: object
      required: [id, name, participants]
      properties:
        id: { type: string }
        name: { type: string }
        createdByMe: { type: boolean }
        participants: { type: array, items: { $ref: "#/components/schemas/RoomParticipant" } }
    Story:
      type: object
      required: [id, authorId, authorName, caption, time]
      properties:
        id: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        colorFrom: { type: string }
        colorTo: { type: string }
        caption: { type: string }
        seen: { type: boolean }
        image: { type: string }
        time: { type: string, format: date-time }
    Wallet:
      type: object
      required: [balance, entries]
      properties:
        balance: { type: integer, description: بالقروش }
        entries: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
    LedgerEntry:
      type: object
      required: [id, title, amount, time]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: integer, description: سالب للسحب }
        time: { type: string, format: date-time }
    BillInquiry:
      type: object
      required: [customerName, amountDue]
      properties:
        customerName: { type: string }
        amountDue: { type: integer }
    Receipt:
      type: object
      required: [id, title, amount, balanceAfter, time]
      properties:
        id: { type: string }
        title: { type: string }
        amount: { type: integer }
        balanceAfter: { type: integer }
        time: { type: string, format: date-time }
    AdPublic:
      type: object
      required: [id, advertiser, headline, link, placements]
      properties:
        id: { type: string }
        advertiser: { type: string }
        headline: { type: string }
        body: { type: string }
        cta: { type: string }
        link: { type: string }
        grad: { type: integer }
        priority: { type: integer }
        dailyCap: { type: integer }
        placements: { type: array, items: { type: string } }
    Ad:
      type: object
      required: [id, placement, title]
      properties:
        id: { type: string }
        placement: { type: string }
        title: { type: string }
        body: { type: string }
        ctaLabel: { type: string }
        ctaUrl: { type: string }
        skipAfterSec: { type: integer, example: 5 }
