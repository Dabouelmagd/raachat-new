name: اختبارات رع شات

# بيشتغل على كل push لـ main وكل pull request — عشان مايوصلش كود مكسور للسيرفر.
# ملحوظة: ده بيختبر بس، مابينشرش. النشر لسه بإيد داليا على السيرفر.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: السيرفر (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: تنزيل التبعيات
        working-directory: server
        run: npm ci
      - name: coturn (عشان اختبار فاحص TURN يشتغل فعلًا مش يتخطّى)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq coturn
      - name: توليد Prisma Client
        working-directory: server
        run: npx prisma generate
      - name: فحص الأنواع
        working-directory: server
        run: npx tsc --noEmit -p tsconfig.json
      - name: الاختبارات
        working-directory: server
        # postgres المدمج (embedded-postgres) مابيشتغلش كـ root — مستخدم runner عادي فتمام
        run: npx vitest run

  web:
    name: الواجهة (بناء + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: تنزيل التبعيات
        run: npm ci
      - name: فحص قاموس الترجمة (تكرار = ترجمة غلط في سكوت)
        run: node scripts/check-phrases.mjs
      - name: فحص الأنواع
        run: npx tsc -b
      - name: بناء نسخة الملف الواحد
        run: npx vite build -c vite.single.config.ts
      # لوحة الإدارة بتتبني هنا كمان عشان اختبارها (test/ui/admin.spec.ts) يلاقي
      # ناتج البناء — من غيره الاختبار بيتخطّى في سكوت.
      - name: بناء لوحة الإدارة (لاختبارها)
        working-directory: admin
        run: npm ci && npx vite build
      # وبناء تاني للوحة **في وضع الـ API**: بناء الديمو فوق مابيعملش ولا نداء
      # شبكة، فاختبار «اللوحة لما السيرفر مايردّش» (admin-retry.spec.ts) مالوش
      # هدف يشتغل عليه فيه وبيتخطّى في سكوت. المنفذ هنا لازم يطابق اللي في
      # الاختبار عشان الطلبات تبقى نفس الأصل (مفيش CORS يخلط النتيجة).
      - name: بناء اللوحة في وضع الـ API (لاختبار إعادة المحاولة)
        working-directory: admin
        run: VITE_API_URL=http://127.0.0.1:4121/api npx vite build --outDir dist-api
      - name: تنزيل تبعيات الاختبارات
        working-directory: test
        run: npm ci
      - name: تنزيل المتصفح
        working-directory: test
        run: npx playwright install --with-deps chromium
      - name: اختبارات الواجهة
        working-directory: test
        run: npx playwright test
      # الموقع التعريفي بيتقدّم من نجنكس كملف ثابت — من غير doctype أو
      # meta viewport المتصفح بيشتغل quirks بنافذة ٩٨٠px وكل التخطيط
      # الريسبونسف يموت على الموبايل، **والصفحة تفضل شكلها سليم على الديسكتوب**.
      - name: الموقع التعريفي سليم كصفحة قائمة بذاتها
        working-directory: test
        run: node site-check.mjs ../site/index.html
      - name: ارفع تقرير الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/playwright-report
            test/test-results
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # وضع الـ API: الوظيفة الوحيدة اللي بتشغّل الواجهة **وهي بتكلّم سيرفر حقيقي**.
  #
  # ليه لوحدها: وظيفة `web` فوق بتشتغل على بناء الديمو اللي **مابيعملش ولا نداء
  # شبكة** — فعطلان خطيرين مستحيل يتكشفوا فيها:
  #   • نص الرسالة بيضيع لو الإرسال فشل، **ومفيش ولا رسالة خطأ** للمستخدم.
  #   • الجروب العام اللي تنضم له يبان **فاضي** لحد ما تعملي تحديث للصفحة.
  # الاتنين كانوا محميّين بسكربتين **يدويين** بس، يعني رجوعهم مابيتكشفش.
  #
  # ودرس من أول تشغيل في الـ CI (١٥ أكتوبر ٢٠٢٦): السكربتين كانوا **مكسّرين من
  # ١٣ أكتوبر** — حارس الـ ١٨+ خلّى `/auth/otp/verify` يطلب `birthDate` لأي حساب
  # جديد، فتسجيل الدخول جوّه السكربت بيفشل و`v.user` تبقى undefined. محدش خد
  # باله لأنهم مكانوش بيتشغّلوا. **الحارس اللي مابيتشغّلش بيبوظ في سكوت.**
  # و`send-failure.ts` كان بيطبع النتيجة للمراجعة البشرية و`exit(0)` دايمًا —
  # بقى بيحكم ويرجّع ٢ عند الفشل، وإلا الوظيفة دي كانت هتبقى خضراء على أي عطل.
  api-mode:
    name: وضع الـ API (الإرسال الفاشل + كلام الجروب + حالات الرسالة)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rachat
          POSTGRES_PASSWORD: rachat
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rachat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: تبعيات الواجهة
        run: npm ci
      - name: تبعيات السيرفر
        working-directory: server
        run: npm ci
      - name: توليد Prisma Client
        working-directory: server
        run: npx prisma generate
      # playwright متثبّت في `test/` لوحده (مش في تبعيات الإنتاج)، والسكربتين
      # بيحمّلوه بمساره الصريح من هناك — فلازم ينزل هنا كمان.
      - name: تبعيات الاختبارات + المتصفح
        working-directory: test
        run: npm ci && npx playwright install --with-deps chromium
      # كل سكربت له منفذ API مختلف وقاعدة باسم مختلف، فالبناء بيتعمل مرتين.
      - name: بناء الواجهة في وضع الـ API (الإرسال الفاشل)
        run: VITE_API_URL=http://localhost:4111 npx vite build -c vite.single.config.ts
      - name: الإرسال الفاشل مابيضيّعش نص المستخدم
        working-directory: server
        run: npx tsx test/manual/send-failure.ts
      - name: بناء الواجهة في وضع الـ API (كلام الجروب)
        run: VITE_API_URL=http://localhost:4112 npx vite build -c vite.single.config.ts
      - name: كلام الجروب بيبان بعد الانضمام من غير تحديث
        working-directory: server
        run: npx tsx test/manual/join-history.ts
      - name: بناء الواجهة في وضع الـ API (حالات الرسالة)
        run: VITE_API_URL=http://localhost:4113 npx vite build -c vite.single.config.ts
      - name: حالات الرسالة بتتحدّث لحظيًا (اتبعتت ← وصلت ← اتقرت)
        working-directory: server
        run: npx tsx test/manual/message-states.ts

  admin:
    name: لوحة الإدارة (بناء)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: تنزيل التبعيات
        working-directory: admin
        run: npm ci
      - name: بناء
        working-directory: admin
        run: npx vite build
