# بناء APK للتجربة على جهاز حقيقي.
#
# ليه على GitHub مش عند Claude: بناء أندرويد محتاج Android SDK من
# `dl.google.com` ومكتبات من `maven.google.com` — والاتنين **محجوبين** في
# allowlist الشبكة بتاعة بيئة Claude (403 على CONNECT). وrunners بتاعة جيت هب
# فيها الـ SDK مثبَّت أصلًا.
#
# التنزيل: صفحة Actions ← آخر تشغيل لـ «APK للموبايل» ← Artifacts ← raachat-apk
#
# ⚠️ الناتج الافتراضي **debug APK** موقَّع بمفتاح التصحيح — للتجربة على جهاز
# بس، ومش صالح للمتجر.
#
# ولحزمة **جوجل بلاي**: شغّلي الوظيفة يدويًا و`aab = true` — بتطلّع
# `app-release.aab` موقَّعة بمفتاح الرفع من Secrets، وبتلاقيها في artifact
# اسمه `raachat-aab` (مش Release عام: المفتاح ده مفتاح رفع، ونشره بلا داعي).
name: APK للموبايل

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "أصل الـ API بلا أي مسار (زي https://api.raachateg.com)"
        default: "https://api.raachateg.com"
        required: true
      aab:
        description: "ابنِ كمان حزمة جوجل بلاي الموقَّعة (AAB) — محتاجة أسرار التوقيع"
        type: boolean
        default: false
  push:
    branches: [main]
    # بس لما حاجة تخصّ التطبيق تتغيّر — مش على كل commit توثيق
    paths: ["src/**", "public/**", "mobile/**", "index.html", "package.json", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    # لازمة لخطوة الـRelease — من غيرها `gh release create` بيرجّع 403.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # الواجهة **بوضع الـ API** — لازم عنوان حقيقي، وإلا الـ APK يطلع
      # بناء الديمو اللي مابيعملش ولا نداء شبكة (نفس درس api-mode في CI).
      - name: بناء الواجهة
        env:
          VITE_API_URL: ${{ inputs.api_url || vars.MOBILE_API_URL || 'https://api.raachateg.com' }}
          # 🔴 الاتنين دول **إلزاميان للـAPK**. من غيرهم `SITE` بيبقى فاضي
          # فروابط الخصوصية والشروط ومعايير المجتمع تبقى **نسبية**، وفي
          # الـAPK بتتحلّ على `https://localhost` وتموت — وشاشة التسجيل
          # بتقول «بالمتابعة أنت توافق على الشروط وسياسة الخصوصية».
          # حصل فعلًا في نسخة ٢٠ أكتوبر ٢٠٢٦، واتكشف من رابط دعوة اتبعت
          # لحد تاني وكان `https://localhost`.
          VITE_SITE_URL: ${{ vars.MOBILE_SITE_URL || 'https://app.raachateg.com' }}
          VITE_PUBLIC_SITE: ${{ vars.MOBILE_PUBLIC_SITE || 'https://raachateg.com' }}
        run: |
          test -n "$VITE_API_URL"
          export VITE_API_URL="${VITE_API_URL%/}"
          # الموقعان لازم يكونا أصلًا عامًّا بلا مسار — نفس قاعدة VITE_API_URL
          for v in VITE_SITE_URL VITE_PUBLIC_SITE; do
            eval "u=\$$v"
            test -n "$u" || { echo "$v must be set for the APK build"; exit 1; }
            u="${u%/}"; eval "export $v=\"\$u\""
            case "$u" in
              https://localhost*|https://127.0.0.1*) echo "$v must not be a local origin: $u"; exit 1;;
              https://*) ;;
              *) echo "$v must start with https://: $u"; exit 1;;
            esac
            case "${u#*://}" in */*) echo "$v must be an origin with no path: $u"; exit 1;; esac
          done
          # 🔴 لازم يكون **أصلًا بلا مسار** — ولازم نفس اللي بناء الواجهة بياخده في
          # compose (`VITE_API_URL: https://api.${DOMAIN}`). أي لاحقة زي `/api`
          # تخلّي Express مايطابقش أي راوت، فالطلب يعدّي راوترات `/auth` ويوصل
          # لراوتر فيه `r.use(requireAuth)` على كل المسارات ويرجّع **401 «غير
          # مصرّح» على كل نداء** — شكله عطل مصادقة أو إيميل، والحقيقة عنوان غلط.
          # حصل فعلًا في أول APK (١٨ أكتوبر ٢٠٢٦): الافتراضي كان فيه `/api`.
          case "${VITE_API_URL#*://}" in
            */*) echo "VITE_API_URL must be an origin with no path: $VITE_API_URL"; exit 1;;
          esac
          npm ci
          npx vite build
          test -f dist/index.html

      - name: نسخ الواجهة جوه مشروع أندرويد
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html

      # ── إشعارات FCM: ملف إعداد Firebase ─────────────────────────────────
      # من غير الملف ده الـplugin مابيتطبّقش (الشرط في app/build.gradle)،
      # والـAPK بيتبني وبيتثبّت **ومابيستلمش ولا إشعار** — ومفيش حاجة تقول كده.
      # فالسطر التحذيري تحت مقصود: بناء بلا إشعارات حالة صالحة للتجربة، إنما
      # لازم تبان في اللوج مش تعدّي في سكوت.
      #
      # والملف في Secrets مش في الريبو: الريبو **عام**، والملف فيه معرّفات
      # مشروع Firebase. (مش مفتاح إرسال — ده حساب الخدمة على السيرفر.)
      - name: إعداد Firebase للإشعارات
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" > mobile/android/app/google-services.json
            # فحص إيجابي: ملف JSON سليم وفيه اسم الحزمة بتاعنا — قيمة مبهدلة
            # في Secret بتخلّي جريدل يفشل برسالة غامضة بعد دقايق بناء.
            node -e "const j=require('./mobile/android/app/google-services.json');
              const ids=(j.client||[]).map(c=>c.client_info.android_client_info.package_name);
              if(!ids.includes('com.raachateg.app')) { console.error('google-services.json مش لحزمة com.raachateg.app: '+ids.join(',')); process.exit(1); }
              console.log('FIREBASE-OK '+j.project_info.project_id);"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON مش متضبط — الـAPK هيتبني **بلا إشعارات أصلية**."
          fi

      - name: بناء الـ APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # فحص إيجابي: الملف موجود وحجمه معقول (أقل من ميجا = بناء فاضي)
      - name: فحص الناتج
        run: |
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "حجم الـ APK: $((SIZE/1048576)) ميجا"
          test "$SIZE" -gt 1000000
          unzip -l "$APK" | grep -q "assets/public/index.html"

      - uses: actions/upload-artifact@v4
        with:
          name: raachat-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ---------- حزمة جوجل بلاي (AAB) موقَّعة ----------
      # بتشتغل بس لما تتطلب من شاشة التشغيل اليدوي (`aab: true`) — مش على كل
      # push: التوقيع بيلمس أسرارًا، والرفع لبلاي قرار مش أثر جانبي لنشرة.
      #
      # 🔴 والحارس **قبل** البناء مش بعده بس: لو سرّ ناقص، جريدل مابيفشلش —
      # بيطلّع `.aab` **غير موقَّعة** وبلاي هي اللي ترفضها بعد الرفع، يعني
      # تشغيلة خضرا وناتج مكسور. فالفحص ده بيسمّي السرّ الناقص ويقف.
      - name: فحص أسرار التوقيع
        if: inputs.aab
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          miss=""
          for v in KS KS_PASS ALIAS KEY_PASS; do
            eval "x=\$$v"
            [ -n "$x" ] || miss="$miss $v"
          done
          if [ -n "$miss" ]; then
            echo "missing signing secrets:$miss"
            echo "needed: ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD"
            exit 1
          fi
          echo "SECRETS-PRESENT"

      - name: بناء AAB موقَّعة
        if: inputs.aab
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # رقم التشغيلة بيزيد لوحده ومابيرجعش، وبلاي مابتقبلش رقمًا مستهلَكًا.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          # المفتاح بيتكتب **برّه الريبو** ($RUNNER_TEMP) عشان مايتلقطش في أي
          # artifact ولا يتسرّب في commit، وبصلاحية 600، وبيتمسح في كل الحالات.
          KS="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
          trap 'rm -f "$KS"' EXIT
          chmod 600 "$KS"
          test -s "$KS"
          export ANDROID_KEYSTORE_PATH="$KS"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: فحص الـ AAB
        if: inputs.aab
        run: |
          AAB=mobile/android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          SIZE=$(stat -c%s "$AAB")
          echo "حجم الـ AAB: $((SIZE/1048576)) ميجا"
          test "$SIZE" -gt 1000000
          # الواجهة جوّاها فعلًا — حزمة من غير `index.html` بتتثبّت وتفتح فاضية
          unzip -l "$AAB" | grep -q "base/assets/public/index.html"
          # 🔴 موقَّعة فعلًا: ده الفرق بين حزمة بلاي تقبلها وحزمة بترفضها بعد
          # الرفع، و`bundleRelease` بينجح في الحالتين فمفيش حاجة تانية تقوله.
          jarsigner -verify "$AAB" | grep -q "jar verified"
          echo "AAB-SIGNED"

      - uses: actions/upload-artifact@v4
        if: inputs.aab
        with:
          name: raachat-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      # نشر الـ APK كـRelease عشان الموقع التعريفي يقدر يوديله برابط عام.
      #
      # ليه Release مش الـartifact اللي فوق: تنزيل الـartifact **محتاج تسجيل
      # دخول في GitHub**، فزرار «نزّل» في الموقع كان هيودّي الزائر لصفحة دخول.
      # وأصل الـRelease رابط مباشر بلا أي حساب.
      #
      # والوسم ثابت (`apk-latest`) والاسم ثابت (`raachat.apk`) عن قصد: الرابط
      # `releases/latest/download/raachat.apk` مكتوب في الموقع، فلو الاسم اتغيّر
      # الزرار يبقى ٤٠٤ **في سكوت** — الموقع مش هيعرف. محمي باختبار.
      #
      # ⚠️ والرابط ده عام لأن الريبو عام. لو الريبو بقى خاص، الزرار يموت.
      - name: نشر الـ APK كـ Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk raachat.apk
          NOTE="بناء تجريبي موقَّع بمفتاح تطوير — مش نسخة متجر. الكوميت: ${GITHUB_SHA::7}"
          # `if` مش `|| true`: الشرط ده بيسأل هل الإصدار موجود، وأي فشل حقيقي
          # جوه الفرعين لسه بيفشّل الخطوة. (`|| true` ممنوع هنا بحارس.)
          if gh release view apk-latest > /dev/null 2>&1; then
            gh release upload apk-latest raachat.apk --clobber
          else
            gh release create apk-latest raachat.apk \
              --title "رع شات — آخر نسخة تجريبية لأندرويد" \
              --notes "$NOTE" \
              --latest
          fi
          # فحص إيجابي: الرابط العام بيردّ فعلًا ومش صفحة دخول
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/raachat.apk"
          CODE=$(curl -sL -o /tmp/dl.apk -w '%{http_code}' "$URL")
          echo "تنزيل عام: $CODE · $(stat -c%s /tmp/dl.apk) بايت"
          test "$CODE" = "200"
          test "$(stat -c%s /tmp/dl.apk)" -gt 1000000
