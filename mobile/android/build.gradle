// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 8.9.2 مش 8.7.2: الأخير أقصى `compileSdk` بيعرفه ٣٥، فـ٣٦ بيطلّع
        // تحذيرًا وبيحتاج `suppressUnsupportedCompileSdk` — يعني بناء على SDK
        // الـAGP نفسه مش فاهمه. و8.9 بيتطلّب Gradle 8.11.1 وJDK 17، والاتنين
        // متوفّران (الـwrapper 8.11.1 ووظيفة البناء على Java 21).
        classpath 'com.android.tools.build:gradle:8.9.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
